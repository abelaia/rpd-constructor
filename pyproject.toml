# Настройки инструментов разработки.

[tool.ruff]
# ruff — линтер и форматтер: проверяет код на соответствие правилам Python (PEP 8)
# и сам исправляет большую часть замечаний.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # оформление кода (PEP 8)
    "F",   # ошибки: неиспользуемые импорты, неопределённые переменные
    "I",   # порядок импортов
    "UP",  # устаревшие конструкции языка
    "B",   # частые источники багов
    "SIM", # места, где код можно упростить
]

[tool.pytest.ini_options]
# pytest — запуск тестов. Тесты лежат в папке tests.
testpaths = ["tests"]
pythonpath = ["."]
